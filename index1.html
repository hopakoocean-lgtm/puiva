<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>培華中學 - 校園采風</title>
  <style>
    :root {
      --primary-color: #1e3a8a;
      --text-color: #1f2937;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --nav-bg: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-color);
      background-color: var(--bg-color);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .navbar {
      background-color: var(--nav-bg);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-color);
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      list-style: none;
      gap: 1.5rem;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text-color);
      font-weight: 500;
      transition: color 0.3s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--primary-color);
    }
    main { flex: 1; }
    .container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }
    .section-title {
      text-align: center;
      font-size: 2rem;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
    }
    .section-subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 2.5rem;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .gallery-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background-color: var(--card-bg);
      cursor: pointer;
      aspect-ratio: 4 / 3;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.05);
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal.open { display: flex; }
    .modal-content {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 4px;
    }
    .close-btn {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      color: #ffffff;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: var(--card-bg);
      border-top: 1px solid #e5e7eb;
      margin-top: auto;
      color: #6b7280;
      font-size: 0.9rem;
    }
    @media (max-width: 768px) {
      .nav-container { padding: 1rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">培華中學</a>
      <ul class="nav-links">
        <li><a href="index.html">學校首頁</a></li>
        <li><a href="gallery.html" class="active">校園采風</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="container">
      <h2 class="section-title">校園采風</h2>
      <p class="section-subtitle">紀錄培華中學的校園設施、活動紀錄與師生精彩瞬間</p>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </main>

  <div class="modal" id="lightboxModal">
    <span class="close-btn" id="closeModal">&times;</span>
    <img class="modal-content" id="modalImg" alt="校園照片預覽">
  </div>

  <footer>
    <p>&copy; 2026 培華中學 Pei Hua Middle School. 版權所有</p>
  </footer>

  <script>
    const photos = [
      'img/photo1.jpg',
      'img/photo2.jpg',
      'img/photo3.jpg',
      'img/photo4.jpg',
      'img/photo5.jpg',
      'img/photo6.jpg',
      'img/photo7.jpg',
      'img/photo8.jpg',
      'img/photo9.jpg'
    ];

    const galleryGrid = document.getElementById('galleryGrid');
    const modal = document.getElementById('lightboxModal');
    const modalImg = document.getElementById('modalImg');
    const closeModal = document.getElementById('closeModal');

    photos.forEach((src, index) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      
      const img = document.createElement('img');
      img.src = src;
      img.alt = `培華中學校園采風 ${index + 1}`;
      img.loading = 'lazy';

      item.appendChild(img);
      galleryGrid.appendChild(item);

      item.addEventListener('click', () => {
        modal.classList.add('open');
        modalImg.src = src;
      });
    });

    closeModal.addEventListener('click', () => {
      modal.classList.remove('open');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('open');
      }
    });
  </script>
</body>
</html>
